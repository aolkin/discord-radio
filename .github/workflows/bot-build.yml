name: Discord Bot Build

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Release
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust and cache dependencies
        uses: ./.github/actions/setup-rust-and-cache
        with:
          cache-key-suffix: release

      - name: Build release
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}
        run: cargo build --release

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: discord-bot-arm64-${{ github.run_number }}
          path: target/release/discord-bot
          retention-days: 30
