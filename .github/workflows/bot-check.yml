name: Discord Bot Validation

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      bot: ${{ steps.filter.outputs.bot }}
      frontend: ${{ steps.filter.outputs.frontend }}

    steps:
      - name: Detect changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3.0.4
        with:
          filters: |
            bot:
              - Dockerfile
              - Cargo.toml
              - Cargo.lock
              - build.rs
              - src/**
              - crates/**
              - .github/actions/setup-rust-and-cache/**
              - .github/workflows/bot-check.yml
            frontend:
              - static/**
              - biome.json
              - package.json
              - package-lock.json
              - pnpm-lock.yaml
              - yarn.lock
              - .github/workflows/bot-check.yml

  check:
    name: Check Bot Code
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.bot == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Rust and cache dependencies
        uses: ./.github/actions/setup-rust-and-cache
        with:
          components: rustfmt, clippy
      - name: Check formatting
        uses: actions-rust-lang/rustfmt@v1

      - name: Check compilation
        run: cargo check --workspace --all-targets --all-features

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace

      - name: Check field-trait README is up to date
        working-directory: crates/field-trait
        run: |
          cargo install cargo-readme --locked --version 3.4.1
          cargo readme -o README.md
          git diff --exit-code -- README.md

  frontend:
    name: Check Frontend Code
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Biome
        uses: biomejs/setup-biome@v2
        with:
          version: 2.5.15

      - name: Lint and check formatting
        run: biome ci static
