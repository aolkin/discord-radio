name: Helm Chart

on:
  push:
    branches:
      - main
    paths:
      - charts/**
      - .github/workflows/chart-publish.yml
  pull_request:
    paths:
      - charts/**
      - .github/workflows/chart-publish.yml

jobs:
  lint:
    name: Lint Chart
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v4.3.0
        with:
          version: v3.18.4

      - name: Lint chart
        run: >-
          helm lint charts/discord-radio
          --set image.repository=example --set image.tag=lint --set existingSecret=example

  publish:
    name: Publish Chart
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v4.3.0
        with:
          version: v3.18.4

      - name: Lint chart
        run: >-
          helm lint charts/discord-radio
          --set image.repository=example --set image.tag=lint --set existingSecret=example

      - name: Package chart
        run: helm package charts/discord-radio --version "0.0.${{ github.run_number }}" --destination dist

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Push chart
        run: helm push dist/discord-radio-0.0.${{ github.run_number }}.tgz "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts"
