name: Discord Bot Image

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  image:
    name: Build Container Image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/${{ github.repository }}:${{ github.run_number }}
          build-args: |
            GITHUB_RUN_NUMBER=${{ github.run_number }}
            GITHUB_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  chart:
    name: Helm Chart
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v4.3.0
        with:
          version: v3.18.4

      - name: Lint chart
        run: helm lint charts/discord-radio --set secret.existingName=example

      - name: Package chart
        if: github.event_name == 'push'
        run: >-
          helm package charts/discord-radio
          --version "0.0.${{ github.run_number }}"
          --app-version "${{ github.run_number }}"
          --destination dist

      - name: Log in to GHCR
        if: github.event_name == 'push'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Push chart
        if: github.event_name == 'push'
        run: helm push dist/discord-radio-0.0.${{ github.run_number }}.tgz "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts"
