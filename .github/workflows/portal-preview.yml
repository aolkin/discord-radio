name: Portal Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: read
    outputs:
      portal: ${{ steps.filter.outputs.portal }}

    steps:
      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3.0.4
        with:
          filters: |
            portal:
              - static/**
              - preview/**
              - .github/workflows/portal-preview.yml

  preview:
    name: Deploy Portal Preview
    needs: changes
    if: needs.changes.outputs.portal == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: portal-preview-${{ github.event.number }}
      cancel-in-progress: true
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build preview
        run: preview/build.sh

      - name: Deploy to Cloudflare Pages
        id: deploy
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          set -o pipefail
          npx --yes wrangler@4 pages deploy dist --project-name=discord-radio-portal-preview --branch="$BRANCH" --commit-hash="$GITHUB_SHA" --commit-dirty=true 2>&1 | tee "$RUNNER_TEMP/deploy.log"
          url=$(grep -Eo 'https://[^ ]+\.pages\.dev' "$RUNNER_TEMP/deploy.log" | tail -n 1)
          if [ -z "$url" ]; then
            echo "Could not find a preview URL in the deploy output" >&2
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment PR with preview URL
        uses: actions/github-script@v9
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const marker = "<!-- portal-preview -->";
            const body = `${marker}\nPortal preview for ${process.env.HEAD_SHA}: ${process.env.PREVIEW_URL}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(
              (comment) => comment.user.login === "github-actions[bot]" && comment.body.includes(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
