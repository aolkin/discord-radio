[workspace]
members = ["crates/field-trait"]

[package]
name = "radio-bot"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
serenity = { version = "0.12", default-features = false, features = ["client", "gateway", "rustls_backend", "model", "cache"] }
poise = "0.7"
songbird = { version = "0.6", features = ["builtin-queue"] }
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "signal", "fs", "sync"] }
tokio-stream = { version = "0.1", features = ["sync"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
typetag = "0.2"
async-trait = "0.1"
dotenvy = "0.15.7"
rand = "0.10"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"

symphonia = { version = "0.6", features = ["mp3", "ogg", "vorbis", "wav"] }
vorbis_rs = { version = "0.5", default-features = false }
rubato = "5"

# Audio DSP processing
biquad = "0.6"
atomic_float = "1.0"

# Opus encoding for audio streaming
opus = "0.4"
ogg = "0.9"
parking_lot = "0.12"

# Web portal dependencies
axum = { version = "0.8", features = ["ws", "multipart"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["fs", "cors"] }
http = "1.0"
futures-util = "0.3"

# S3-compatible object storage
rust-s3 = { version = "0.38", default-features = false, features = ["tokio-rustls-tls"] }

# OpenTelemetry metrics
opentelemetry = { version = "0.33", features = ["metrics"] }
opentelemetry_sdk = { version = "0.33", features = ["metrics", "rt-tokio"] }
opentelemetry-otlp = { version = "0.33", features = ["metrics", "http-proto", "reqwest-client"] }
moka = { version = "0.12.16", features = ["future"] }
thiserror = "2.0.20"
strum = { version = "0.28.0", features = ["derive"] }
rust-embed = { version = "8.13.0", features = ["include-exclude", "mime-guess"] }

[dev-dependencies]
tempfile = "3.0"
