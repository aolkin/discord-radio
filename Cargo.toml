[package]
name = "discord-bot"
version = "0.1.0"
edition = "2024"

[dependencies]
serenity = { version = "0.12", default-features = false, features = ["client", "gateway", "rustls_backend", "model", "cache"] }
poise = "0.6"
songbird = { version = "0.5", features = ["builtin-queue"] }
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "signal", "fs"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
dotenvy = "0.15.7"
rand = "0.9.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Audio codec support via Symphonia
symphonia = { version = "0.5", features = ["mp3", "vorbis", "wav"] }

# Audio DSP processing
dasp = { version = "0.11", features = ["signal", "interpolate", "ring_buffer"] }
dasp_signal = "0.11"
dasp_interpolate = "0.11"
dasp_sample = "0.11"
biquad = "0.4"
rubato = "0.15"
atomic_float = "1.0"
