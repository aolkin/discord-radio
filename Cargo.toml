[package]
name = "discord-bot"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
serenity = { version = "0.12", default-features = false, features = ["client", "gateway", "rustls_backend", "model", "cache"] }
poise = "0.6"
songbird = { version = "0.5", features = ["builtin-queue"] }
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "signal", "fs"] }
tokio-util = "0.7"
tokio-stream = { version = "0.1", features = ["sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
dotenvy = "0.15.7"
rand = "0.9.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }

# Audio codec support via Symphonia
symphonia = { version = "0.5", features = ["mp3", "ogg", "vorbis", "wav"] }

# Audio DSP processing
biquad = "0.4"
atomic_float = "1.0"

# Opus encoding for audio streaming
opus = "0.3"
ogg = "0.9"
parking_lot = "0.12"

# Web portal dependencies
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "cors"] }
http = "1.0"
futures-util = "0.3"

# S3-compatible object storage
rust-s3 = { version = "0.35", default-features = false, features = ["tokio-rustls-tls"] }

# OpenTelemetry metrics
opentelemetry = { version = "0.27", features = ["metrics"] }
opentelemetry_sdk = { version = "0.27", features = ["metrics", "rt-tokio"] }
opentelemetry-otlp = { version = "0.27", features = ["metrics", "http-proto", "reqwest-client"] }

[dev-dependencies]
tempfile = "3.0"
