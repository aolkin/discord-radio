apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "discord-radio.fullname" . }}
  labels:
    {{- include "discord-radio.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "discord-radio.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "discord-radio.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: bot
          image: {{ include "discord-radio.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.web.port }}
              protocol: TCP
          env:
            - name: WEB_PORT
              value: {{ .Values.web.port | quote }}
            - name: FILE_CACHE_TTL_SECS
              value: {{ .Values.cache.ttlSecs | int64 | quote }}
            - name: FILE_CACHE_MAX_BYTES
              value: {{ .Values.cache.maxBytes | int64 | quote }}
            - name: FILE_CACHE_SWEEP_INTERVAL_SECS
              value: {{ .Values.cache.sweepIntervalSecs | int64 | quote }}
            - name: METRICS_INTERVAL_SECONDS
              value: {{ .Values.metrics.intervalSeconds | int64 | quote }}
            {{- with .Values.web.corsAllowedOrigins }}
            - name: WEB_CORS_ALLOWED_ORIGINS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with .Values.logging.rustLog }}
            - name: RUST_LOG
              value: {{ . | quote }}
            {{- end }}
            {{- range $env, $key := .Values.secret.keys }}
            {{- include "discord-radio.secretEnv" (dict "root" $ "env" $env "key" $key "optional" (ne $env "DISCORD_TOKEN")) | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
          volumeMounts:
            - name: state
              mountPath: /data/state
            - name: cache
              mountPath: /data/cache
            {{- if .Values.content.existingClaim }}
            - name: content
              mountPath: /data/content
              readOnly: {{ .Values.content.readOnly }}
              {{- with .Values.content.subPath }}
              subPath: {{ . | quote }}
              {{- end }}
            {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: {{ default (include "discord-radio.fullname" .) .Values.persistence.existingClaim }}
        - name: cache
          emptyDir:
            sizeLimit: {{ .Values.cache.sizeLimit | quote }}
        {{- if .Values.content.existingClaim }}
        - name: content
          persistentVolumeClaim:
            claimName: {{ .Values.content.existingClaim }}
            readOnly: {{ .Values.content.readOnly }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
