apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "discord-radio.fullname" . }}
  labels:
    {{- include "discord-radio.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "discord-radio.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "discord-radio.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: bot
          image: {{ include "discord-radio.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.web.port }}
              protocol: TCP
          env:
            - name: STATE_STORE_PATH
              value: /data/state
            - name: FILE_CACHE_DIR
              value: /data/cache
            - name: WEB_PORT
              value: {{ .Values.web.port | quote }}
            - name: FILE_CACHE_TTL_SECS
              value: {{ .Values.cache.ttlSecs | int64 | quote }}
            - name: METRICS_INTERVAL_SECONDS
              value: {{ .Values.metrics.intervalSeconds | int64 | quote }}
            {{- with .Values.web.corsAllowedOrigins }}
            - name: WEB_CORS_ALLOWED_ORIGINS
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.logging.level }}
            - name: RUST_LOG
              value: {{ . | quote }}
            {{- end }}
            {{- include "discord-radio.secretEnv" (dict "root" . "env" "DISCORD_TOKEN" "key" .Values.secret.keys.discordToken "optional" false) | nindent 12 }}
            {{- include "discord-radio.secretEnv" (dict "root" . "env" "BUCKET_ENDPOINT" "key" .Values.secret.keys.bucketEndpoint "optional" true) | nindent 12 }}
            {{- include "discord-radio.secretEnv" (dict "root" . "env" "BUCKET_ACCESS_KEY_ID" "key" .Values.secret.keys.bucketAccessKeyId "optional" true) | nindent 12 }}
            {{- include "discord-radio.secretEnv" (dict "root" . "env" "BUCKET_SECRET_ACCESS_KEY" "key" .Values.secret.keys.bucketSecretAccessKey "optional" true) | nindent 12 }}
            {{- include "discord-radio.secretEnv" (dict "root" . "env" "BUCKET_NAME" "key" .Values.secret.keys.bucketName "optional" true) | nindent 12 }}
            {{- include "discord-radio.secretEnv" (dict "root" . "env" "GRAFANA_METRICS_URL" "key" .Values.secret.keys.grafanaMetricsUrl "optional" true) | nindent 12 }}
            {{- include "discord-radio.secretEnv" (dict "root" . "env" "GRAFANA_API_KEY" "key" .Values.secret.keys.grafanaApiKey "optional" true) | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
          volumeMounts:
            - name: state
              mountPath: /data/state
            - name: cache
              mountPath: /data/cache
            {{- if .Values.content.existingClaim }}
            - name: content
              mountPath: /data/content
              readOnly: {{ .Values.content.readOnly }}
              {{- with .Values.content.subPath }}
              subPath: {{ . | quote }}
              {{- end }}
            {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: {{ default (include "discord-radio.fullname" .) .Values.persistence.existingClaim }}
        - name: cache
          emptyDir:
            {{- if not .Values.cache.sizeLimit }} {}{{- end }}
            {{- with .Values.cache.sizeLimit }}
            sizeLimit: {{ . | quote }}
            {{- end }}
        {{- if .Values.content.existingClaim }}
        - name: content
          persistentVolumeClaim:
            claimName: {{ .Values.content.existingClaim }}
            readOnly: {{ .Values.content.readOnly }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
