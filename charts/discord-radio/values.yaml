image:
  repository: ghcr.io/aolkin/discord-radio
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []
secret:
  name: ""
  keys:
    discordToken: DISCORD_TOKEN
    bucketEndpoint: BUCKET_ENDPOINT
    bucketAccessKeyId: BUCKET_ACCESS_KEY_ID
    bucketSecretAccessKey: BUCKET_SECRET_ACCESS_KEY
    bucketName: BUCKET_NAME
    grafanaMetricsUrl: GRAFANA_METRICS_URL
    grafanaApiKey: GRAFANA_API_KEY
web:
  port: 3000
  corsAllowedOrigins: ""
cache:
  ttlSecs: 2592000
  sizeLimit: ""
metrics:
  intervalSeconds: 60
logging:
  level: ""
persistence:
  size: 256Mi
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  existingClaim: ""
service:
  type: ClusterIP
  port: 80
httpRoute:
  enabled: false
  parentRef:
    name: ""
    namespace: ""
    sectionName: ""
  hostnames: []
resources:
  requests:
    cpu: 100m
    memory: 128Mi
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
