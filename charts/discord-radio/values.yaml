image:
  repository: ghcr.io/aolkin/discord-radio
  tag: ""
  # Takes precedence over the tag.
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []
secret:
  existingName: ""
  # Only the Discord token is required.
  keyNames:
    discordToken: DISCORD_TOKEN
    bucketEndpoint: BUCKET_ENDPOINT
    bucketAccessKeyId: BUCKET_ACCESS_KEY_ID
    bucketSecretAccessKey: BUCKET_SECRET_ACCESS_KEY
    bucketName: BUCKET_NAME
    grafanaMetricsUrl: GRAFANA_METRICS_URL
    grafanaApiKey: GRAFANA_API_KEY
web:
  port: 3000
  # Comma-separated.
  corsAllowedOrigins: ""
cache:
  # Cached files older than this are removed at startup. 0 keeps them forever.
  ttlSecs: 2592000
  sizeLimit: ""
metrics:
  intervalSeconds: 60
logging:
  rustLog: ""
statePersistence:
  size: 256Mi
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  existingClaim: ""
# Mounted at /data/content.
content:
  existingClaim: ""
  readOnly: true
  subPath: ""
service:
  type: ClusterIP
  port: 80
# The chart does not handle authentication.
httpRoute:
  enabled: false
  # Becomes the route's spec.parentRefs: the Gateway that serves this route.
  parentRef:
    name: ""
    namespace: ""
    listener: ""
  hostnames: []
resources:
  requests:
    cpu: 100m
    memory: 64Mi
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
