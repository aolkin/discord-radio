image:
  repository: ghcr.io/aolkin/discord-radio
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []
secret:
  name: ""
  # Only the Discord token is required.
web:
  port: 3000
  corsAllowedOrigins: []
cache:
  ttlSecs: 2592000
  maxBytes: 805306368
  sweepIntervalSecs: 300
  sizeLimit: 1Gi
metrics:
  intervalSeconds: 60
logging:
  rustLog: ""
persistence:
  size: 64Mi
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  existingClaim: ""
content:
  existingClaim: ""
  readOnly: true
  subPath: ""
service:
  type: ClusterIP
  port: 80
httpRoute:
  enabled: false
  parentRef:
    name: ""
    namespace: ""
    listener: ""
  hostnames: []
resources:
  requests:
    cpu: 100m
    memory: 64Mi
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
