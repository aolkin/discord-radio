<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Discord Bot Portal</title>
        <script type="module" src="/static/index.js"></script>
        <script defer src="/static/alpine.min.js"></script>
        <link rel="stylesheet" href="/static/base.css">
        <link rel="stylesheet" href="/static/index.css">
    </head>
    <body x-data="botPortal()">
        <div class="container">
            <header>
                <div class="header-left">
                    <h1>🎵 Discord Bot Portal</h1>
                    <div class="version-info" x-show="version">
                        Version: <span x-text="version"></span> • Commit:
                        <span x-text="commitHash ? commitHash.substring(0, 7) : 'unknown'"></span>
                    </div>
                </div>
                <div class="header-right">
                    <!-- Current Activity Display -->
                    <div class="activity-display" x-show="currentActivity.status" @click="openModal('activity')">
                        <div class="activity-icon" x-text="getActivityIcon(currentActivity.activity_type)"></div>
                        <div class="activity-info">
                            <div class="activity-type" x-text="currentActivity.activity_type || 'No Activity'"></div>
                            <div class="activity-status" x-text="currentActivity.status || 'Not set'"></div>
                        </div>
                    </div>
                    <button type="button" class="btn btn-primary btn-md" @click="openModal('activity')">
                        Manage Activity
                    </button>
                    <button type="button" class="btn btn-primary btn-md" @click="openChannelMessageModal()">
                        Send Message
                    </button>
                    <div class="status-indicator">
                        <span class="status-dot" :class="{ 'disconnected': !connected }"></span>
                        <span x-text="statusText"></span>
                    </div>
                </div>
            </header>

            <nav class="row-gap-10 view-switch">
                <a href="#/live" class="btn" :class="route.view === 'live' ? 'btn-primary' : 'btn-secondary'">Live</a>
                <a href="#/edit" class="btn" :class="route.view === 'edit' ? 'btn-primary' : 'btn-secondary'">Edit</a>
            </nav>

            <div class="edit-view" x-show="route.view === 'edit'">
                <nav class="card">
                    <div class="section">
                        <div class="section-title">
                            DJ Configs
                            <button
                                type="button"
                                class="btn btn-secondary btn-float-right"
                                @click="openItem('dj-configs', newItem)"
                            >
                                + New
                            </button>
                        </div>
                        <template x-for="config in djConfigs" :key="config">
                            <div>
                                <button
                                    type="button"
                                    class="btn tree-item"
                                    :class="isSelected('dj-configs', config) ? 'btn-primary' : 'btn-secondary'"
                                    @click="openItem('dj-configs', config)"
                                >
                                    <span x-text="config"></span>
                                    <span
                                        class="draft-dot"
                                        title="Unsaved changes"
                                        x-show="changeCount('dj-configs', config) > 0"
                                    ></span>
                                </button>
                                <div class="tree-children">
                                    <template x-for="pool in djConfigPools[config] ?? []" :key="pool">
                                        <button
                                            type="button"
                                            class="btn tree-item"
                                            :class="isSelected('pools', pool) ? 'btn-primary' : 'btn-secondary'"
                                            @click="openItem('pools', pool)"
                                        >
                                            <span x-text="pool"></span>
                                            <span
                                                class="draft-dot"
                                                title="Unsaved changes"
                                                x-show="changeCount('pools', pool) > 0"
                                            ></span>
                                        </button>
                                    </template>
                                </div>
                            </div>
                        </template>
                        <div class="empty-state" x-show="djConfigs.length === 0">No DJ configs</div>
                    </div>

                    <div class="section">
                        <div class="section-title">
                            Pools
                            <button
                                type="button"
                                class="btn btn-secondary btn-float-right"
                                @click="openItem('pools', newItem)"
                            >
                                + New
                            </button>
                        </div>
                        <template x-for="pool in pools" :key="pool">
                            <button
                                type="button"
                                class="btn tree-item"
                                :class="isSelected('pools', pool) ? 'btn-primary' : 'btn-secondary'"
                                @click="openItem('pools', pool)"
                            >
                                <span x-text="pool"></span>
                                <span
                                    class="draft-dot"
                                    title="Unsaved changes"
                                    x-show="changeCount('pools', pool) > 0"
                                ></span>
                            </button>
                        </template>
                        <div class="empty-state" x-show="pools.length === 0">No pools</div>
                    </div>

                    <div class="section">
                        <div class="section-title">
                            Signal Profiles
                            <button
                                type="button"
                                class="btn btn-secondary btn-float-right"
                                @click="openItem('signal-profiles', newItem)"
                            >
                                + New
                            </button>
                        </div>
                        <template x-for="profile in profiles" :key="profile">
                            <button
                                type="button"
                                class="btn tree-item"
                                :class="isSelected('signal-profiles', profile) ? 'btn-primary' : 'btn-secondary'"
                                @click="openItem('signal-profiles', profile)"
                            >
                                <span x-text="profile"></span>
                                <span
                                    class="draft-dot"
                                    title="Unsaved changes"
                                    x-show="changeCount('signal-profiles', profile) > 0"
                                ></span>
                            </button>
                        </template>
                        <div class="empty-state" x-show="profiles.length === 0">No signal profiles</div>
                    </div>

                    <div class="section">
                        <div class="section-title">Audio Files</div>
                        <button
                            type="button"
                            class="btn tree-item"
                            :class="route.kind === 'files' ? 'btn-primary' : 'btn-secondary'"
                            @click="openItem('files', 'tracks')"
                        >
                            Browse Audio Files
                        </button>
                    </div>
                </nav>

                <div>
                    <div class="card empty-state" x-show="!route.kind">Select an item to edit</div>
                    <template x-if="route.kind">
                        <section class="card draft-bar" x-show="!editorStatus(route.kind).loading">
                            <div
                                x-show="editorStatus(route.kind).message.text"
                                :class="editorStatus(route.kind).message.type === 'error' ? 'error-message' : 'success-message'"
                                x-text="editorStatus(route.kind).message.text"
                            ></div>
                            <template x-for="error in draftErrors(route.kind)" :key="error">
                                <div class="error-message" x-text="error"></div>
                            </template>
                            <div class="draft-bar-row">
                                <span
                                    class="draft-count"
                                    x-text="changeCount(route.kind, route.name) === 1 ? '1 unsaved change' : changeCount(route.kind, route.name) + ' unsaved changes'"
                                ></span>
                                <div class="row-gap-10" x-show="!draftReviewing">
                                    <button
                                        type="button"
                                        class="btn btn-secondary"
                                        :disabled="changeCount(route.kind, route.name) === 0"
                                        @click="discardDraft(route.kind)"
                                    >
                                        Discard draft
                                    </button>
                                    <button
                                        type="button"
                                        class="btn btn-primary"
                                        :disabled="changeCount(route.kind, route.name) === 0 || draftErrors(route.kind).length > 0"
                                        @click="reviewDraft(route.kind)"
                                    >
                                        Review changes
                                    </button>
                                </div>
                                <div class="row-gap-10" x-show="draftReviewing">
                                    <button type="button" class="btn btn-secondary" @click="draftReviewing = false">
                                        Back
                                    </button>
                                    <button
                                        type="button"
                                        class="btn btn-primary"
                                        :disabled="editorStatus(route.kind).saving"
                                        @click="applyDraft(route.kind)"
                                        x-text="editorStatus(route.kind).saving ? 'Applying...' : 'Apply'"
                                    ></button>
                                </div>
                            </div>
                            <table class="review-table" x-show="draftReviewing">
                                <thead>
                                    <tr>
                                        <th>Field</th>
                                        <th>Was</th>
                                        <th>Now</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template x-for="change in reviewList(route.kind)" :key="change.label">
                                        <tr>
                                            <td x-text="change.label"></td>
                                            <td x-text="change.was"></td>
                                            <td x-text="change.now"></td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </section>
                    </template>
                    <section class="card" x-show="route.kind === 'signal-profiles'">
                        <!-- biome-ignore lint/a11y/useHeadingContent: the heading text comes from x-text -->
                        <h2
                            class="card-title"
                            x-text="profileEditorIsNew ? 'New Signal Profile' : 'Edit Signal Profile'"
                        ></h2>
                        <div class="loading" x-show="profileEditorLoading">Loading...</div>
                        <form
                            x-show="!profileEditorLoading && !draftReviewing"
                            @submit.prevent="reviewDraft('signal-profiles')"
                        >
                            <div class="form-group">
                                <label class="form-label" for="profile-editor-name">Name</label>
                                <input
                                    id="profile-editor-name"
                                    type="text"
                                    class="form-input"
                                    x-model="profileForm.name"
                                    :readonly="!profileEditorIsNew"
                                    :aria-invalid="nameInvalid('signal-profiles')"
                                    required
                                    pattern="[A-Za-z0-9_\-]+"
                                    title="Letters, digits, - and _ only"
                                >
                            </div>
                            <div class="form-row">
                                <template x-for="item in profileFieldRows()" :key="item.path.join('-')">
                                    <div class="form-group">
                                        <!-- biome-ignore lint/a11y/noLabelWithoutControl: the label text comes from x-text -->
                                        <label
                                            class="form-label"
                                            :for="'profile-field-' + item.path.join('-')"
                                            x-text="item.field.label"
                                        ></label>
                                        <input
                                            :id="'profile-field-' + item.path.join('-')"
                                            type="number"
                                            class="form-input"
                                            x-model.number="item.row[item.field.key]"
                                            :step="item.field.step"
                                            :min="item.field.min"
                                            :max="item.field.max"
                                            :required="!item.field.optional"
                                            :placeholder="item.field.optional ? 'Off' : ''"
                                            :aria-invalid="fieldInvalid(item.field, item.row[item.field.key])"
                                        >
                                        <span
                                            class="field-was"
                                            x-show="isChanged('signal-profiles', item.path)"
                                            x-text="'was ' + wasValue('signal-profiles', item.path)"
                                        ></span>
                                    </div>
                                </template>
                            </div>
                        </form>
                    </section>

                    <section class="card" x-show="route.kind === 'dj-configs'">
                        <!-- biome-ignore lint/a11y/useHeadingContent: the heading text comes from x-text -->
                        <h2 class="card-title" x-text="djConfigEditorIsNew ? 'New DJ Config' : 'Edit DJ Config'"></h2>
                        <div class="loading" x-show="djConfigEditorLoading">Loading...</div>
                        <form
                            x-show="!djConfigEditorLoading && !draftReviewing"
                            @submit.prevent="reviewDraft('dj-configs')"
                        >
                            <datalist id="dj-config-profile-options">
                                <template x-for="profile in profiles" :key="profile">
                                    <option :value="profile"></option>
                                </template>
                            </datalist>
                            <div class="modal-section">
                                <div class="form-group">
                                    <label class="form-label" for="dj-config-editor-name">Name</label>
                                    <input
                                        id="dj-config-editor-name"
                                        type="text"
                                        class="form-input"
                                        x-model="djConfigForm.name"
                                        :readonly="!djConfigEditorIsNew"
                                        :aria-invalid="nameInvalid('dj-configs')"
                                        required
                                        pattern="[A-Za-z0-9_\-]+"
                                        title="Letters, digits, - and _ only"
                                    >
                                </div>
                            </div>

                            <div class="modal-section">
                                <div class="modal-section-title">Pools</div>
                                <template
                                    x-for="(reference, referenceIndex) in djConfigForm.pools"
                                    :key="referenceIndex"
                                >
                                    <div class="list-row">
                                        <div class="form-row">
                                            <div class="form-group">
                                                <label class="form-label">
                                                    <span>Pool</span>
                                                    <select
                                                        class="form-input"
                                                        x-model="reference.pool"
                                                        :aria-invalid="reference.pool === ''"
                                                        required
                                                    >
                                                        <option value="">Select a pool</option>
                                                        <template
                                                            x-for="name in djConfigPoolOptions(reference)"
                                                            :key="name"
                                                        >
                                                            <option :value="name" x-text="name"></option>
                                                        </template>
                                                    </select>
                                                </label>
                                                <span
                                                    class="field-was"
                                                    x-show="isChanged('dj-configs', ['pools', referenceIndex, 'pool'])"
                                                    x-text="'was ' + wasValue('dj-configs', ['pools', referenceIndex, 'pool'])"
                                                ></span>
                                            </div>
                                            <div class="form-group">
                                                <label class="form-label">
                                                    <span>Weight</span>
                                                    <input
                                                        type="number"
                                                        class="form-input"
                                                        x-model.number="reference.weight"
                                                        step="1"
                                                        min="1"
                                                        :aria-invalid="fieldInvalid(djConfigWeightField, reference.weight)"
                                                        required
                                                    >
                                                </label>
                                                <span
                                                    class="field-was"
                                                    x-show="isChanged('dj-configs', ['pools', referenceIndex, 'weight'])"
                                                    x-text="'was ' + wasValue('dj-configs', ['pools', referenceIndex, 'weight'])"
                                                ></span>
                                            </div>
                                        </div>
                                        <template
                                            x-for="(block, blockIndex) in djConfigReferenceBlocks(reference, referenceIndex)"
                                            :key="blockIndex"
                                        >
                                            <div>
                                                <div class="form-label" x-show="block.label" x-text="block.label"></div>
                                                <div class="form-row">
                                                    <template x-for="field in block.fields" :key="field.key">
                                                        <div class="form-group">
                                                            <label class="form-label">
                                                                <span x-text="field.label"></span>
                                                                <template x-if="field.type === 'number'">
                                                                    <input
                                                                        type="number"
                                                                        class="form-input"
                                                                        x-model.number="block.row[field.key]"
                                                                        :step="field.step"
                                                                        :min="field.min"
                                                                        :max="field.max"
                                                                        :required="!field.optional"
                                                                        :aria-invalid="fieldInvalid(field, block.row[field.key])"
                                                                        :placeholder="field.optional ? 'Optional' : ''"
                                                                    >
                                                                </template>
                                                                <template x-if="field.type === 'text'">
                                                                    <input
                                                                        type="text"
                                                                        class="form-input"
                                                                        x-model="block.row[field.key]"
                                                                        :list="field.profile ? 'dj-config-profile-options' : null"
                                                                        :required="!field.optional"
                                                                        :aria-invalid="fieldInvalid(field, block.row[field.key])"
                                                                        :placeholder="field.optional ? 'Optional' : ''"
                                                                    >
                                                                </template>
                                                                <template x-if="field.type === 'bool'">
                                                                    <select
                                                                        class="form-input"
                                                                        x-model="block.row[field.key]"
                                                                    >
                                                                        <option value="">Default</option>
                                                                        <option value="true">Yes</option>
                                                                        <option value="false">No</option>
                                                                    </select>
                                                                </template>
                                                            </label>
                                                            <span
                                                                class="field-was"
                                                                x-show="isChanged('dj-configs', block.path.concat(field.key))"
                                                                x-text="'was ' + wasValue('dj-configs', block.path.concat(field.key))"
                                                            ></span>
                                                            <template x-if="field.type === 'strings'">
                                                                <div>
                                                                    <template
                                                                        x-for="(value, valueIndex) in block.row[field.key]"
                                                                        :key="valueIndex"
                                                                    >
                                                                        <div class="list-row">
                                                                            <input
                                                                                type="text"
                                                                                class="form-input"
                                                                                :aria-label="field.label"
                                                                                x-model="block.row[field.key][valueIndex]"
                                                                                :aria-invalid="block.row[field.key][valueIndex] === ''"
                                                                                required
                                                                            >
                                                                            <button
                                                                                type="button"
                                                                                class="btn btn-secondary"
                                                                                @click="block.row[field.key].splice(valueIndex, 1)"
                                                                            >
                                                                                Remove
                                                                            </button>
                                                                        </div>
                                                                    </template>
                                                                    <button
                                                                        type="button"
                                                                        class="btn btn-secondary"
                                                                        @click="block.row[field.key].push('')"
                                                                    >
                                                                        + Add
                                                                    </button>
                                                                </div>
                                                            </template>
                                                        </div>
                                                    </template>
                                                </div>
                                            </div>
                                        </template>
                                        <button
                                            type="button"
                                            class="btn btn-secondary"
                                            @click="toggleDjConfigReferenceHexConfig(reference)"
                                            x-text="reference.segment_defaults.hex_config ? 'Remove Hex Config' : '+ Add Hex Config'"
                                        ></button>
                                        <button
                                            type="button"
                                            class="btn btn-secondary"
                                            @click="djConfigForm.pools.splice(referenceIndex, 1)"
                                        >
                                            Remove
                                        </button>
                                    </div>
                                </template>
                                <div class="empty-state" x-show="djConfigForm.pools.length === 0">No pools</div>
                                <button type="button" class="btn btn-secondary" @click="addDjConfigPool()">
                                    + Add Pool
                                </button>
                            </div>

                            <template x-for="rotation in djConfigRotations" :key="rotation.key">
                                <div class="modal-section">
                                    <div class="modal-section-title" x-text="rotation.label"></div>
                                    <template x-for="(row, index) in djConfigForm[rotation.key].entries" :key="index">
                                        <div class="list-row">
                                            <div class="form-row">
                                                <template x-for="field in rotation.entryFields" :key="field.key">
                                                    <div class="form-group">
                                                        <!-- biome-ignore lint/a11y/noLabelWithoutControl: the input is rendered by a template inside the label -->
                                                        <label class="form-label">
                                                            <span x-text="field.label"></span>
                                                            <template x-if="field.type === 'number'">
                                                                <input
                                                                    type="number"
                                                                    class="form-input"
                                                                    x-model.number="row[field.key]"
                                                                    :step="field.step"
                                                                    :min="field.min"
                                                                    :max="field.max"
                                                                    :required="!field.optional"
                                                                    :aria-invalid="fieldInvalid(field, row[field.key])"
                                                                    :placeholder="field.optional ? 'Optional' : ''"
                                                                >
                                                            </template>
                                                            <template x-if="field.type === 'text'">
                                                                <input
                                                                    type="text"
                                                                    class="form-input"
                                                                    x-model="row[field.key]"
                                                                    :list="field.profile ? 'dj-config-profile-options' : null"
                                                                    :required="!field.optional"
                                                                    :aria-invalid="fieldInvalid(field, row[field.key])"
                                                                    :placeholder="field.optional ? 'Optional' : ''"
                                                                >
                                                            </template>
                                                        </label>
                                                        <span
                                                            class="field-was"
                                                            x-show="isChanged('dj-configs', [rotation.key, 'entries', index, field.key])"
                                                            x-text="'was ' + wasValue('dj-configs', [rotation.key, 'entries', index, field.key])"
                                                        ></span>
                                                    </div>
                                                </template>
                                            </div>
                                            <button
                                                type="button"
                                                class="btn btn-secondary"
                                                @click="djConfigForm[rotation.key].entries.splice(index, 1)"
                                            >
                                                Remove
                                            </button>
                                        </div>
                                    </template>
                                    <div class="empty-state" x-show="djConfigForm[rotation.key].entries.length === 0">
                                        No entries
                                    </div>
                                    <button
                                        type="button"
                                        class="btn btn-secondary"
                                        @click="addDjConfigRotationEntry(rotation)"
                                        x-text="rotation.addLabel"
                                    ></button>
                                </div>
                            </template>
                        </form>
                    </section>

                    <section class="card" x-show="route.kind === 'pools'">
                        <!-- biome-ignore lint/a11y/useHeadingContent: the heading text comes from x-text -->
                        <h2 class="card-title" x-text="poolEditorIsNew ? 'New Pool' : 'Edit Pool'"></h2>
                        <div class="modal-section" x-show="!poolEditorIsNew">
                            <div class="modal-section-title">Used By</div>
                            <div class="chip-list">
                                <template x-for="config in poolUsers(route.name)" :key="config">
                                    <button
                                        type="button"
                                        class="btn btn-secondary"
                                        @click="openItem('dj-configs', config)"
                                        x-text="config"
                                    ></button>
                                </template>
                                <div class="empty-state" x-show="poolUsers(route.name).length === 0">No DJ configs</div>
                            </div>
                        </div>
                        <div class="loading" x-show="poolEditorLoading">Loading...</div>
                        <form x-show="!poolEditorLoading && !draftReviewing" @submit.prevent="reviewDraft('pools')">
                            <datalist id="pool-editor-profile-options">
                                <template x-for="profile in profiles" :key="profile">
                                    <option :value="profile"></option>
                                </template>
                            </datalist>
                            <div class="modal-section">
                                <div class="form-group">
                                    <label class="form-label" for="pool-editor-name">Name</label>
                                    <input
                                        id="pool-editor-name"
                                        type="text"
                                        class="form-input"
                                        x-model="poolForm.name"
                                        :readonly="!poolEditorIsNew"
                                        :aria-invalid="nameInvalid('pools')"
                                        required
                                        pattern="[A-Za-z0-9_\-]+"
                                        title="Letters, digits, - and _ only"
                                    >
                                </div>
                            </div>

                            <div class="modal-section">
                                <template x-for="(block, blockIndex) in poolBlocks()" :key="blockIndex">
                                    <div class="list-row">
                                        <div class="form-label" x-show="block.label" x-text="block.label"></div>
                                        <div class="form-row">
                                            <template x-for="field in block.fields" :key="field.key">
                                                <div class="form-group">
                                                    <label class="form-label">
                                                        <span x-text="field.label"></span>
                                                        <template x-if="field.type === 'number'">
                                                            <input
                                                                type="number"
                                                                class="form-input"
                                                                x-model.number="block.row[field.key]"
                                                                :step="field.step"
                                                                :min="field.min"
                                                                :max="field.max"
                                                                :required="!field.optional"
                                                                :aria-invalid="fieldInvalid(field, block.row[field.key])"
                                                                :placeholder="field.optional ? 'Optional' : ''"
                                                            >
                                                        </template>
                                                        <template x-if="field.type === 'text'">
                                                            <input
                                                                type="text"
                                                                class="form-input"
                                                                x-model="block.row[field.key]"
                                                                :list="field.profile ? 'pool-editor-profile-options' : null"
                                                                :required="!field.optional"
                                                                :aria-invalid="fieldInvalid(field, block.row[field.key])"
                                                                :placeholder="field.optional ? 'Optional' : ''"
                                                            >
                                                        </template>
                                                        <template x-if="field.type === 'bool'">
                                                            <select class="form-input" x-model="block.row[field.key]">
                                                                <option value="">Default</option>
                                                                <option value="true">Yes</option>
                                                                <option value="false">No</option>
                                                            </select>
                                                        </template>
                                                    </label>
                                                    <span
                                                        class="field-was"
                                                        x-show="isChanged('pools', block.path.concat(field.key))"
                                                        x-text="'was ' + wasValue('pools', block.path.concat(field.key))"
                                                    ></span>
                                                    <template x-if="field.type === 'strings'">
                                                        <div>
                                                            <template
                                                                x-for="(value, valueIndex) in block.row[field.key]"
                                                                :key="valueIndex"
                                                            >
                                                                <div class="list-row">
                                                                    <input
                                                                        type="text"
                                                                        class="form-input"
                                                                        :aria-label="field.label"
                                                                        x-model="block.row[field.key][valueIndex]"
                                                                        :aria-invalid="block.row[field.key][valueIndex] === ''"
                                                                        required
                                                                    >
                                                                    <button
                                                                        type="button"
                                                                        class="btn btn-secondary"
                                                                        @click="block.row[field.key].splice(valueIndex, 1)"
                                                                    >
                                                                        Remove
                                                                    </button>
                                                                </div>
                                                            </template>
                                                            <button
                                                                type="button"
                                                                class="btn btn-secondary"
                                                                @click="block.row[field.key].push('')"
                                                            >
                                                                + Add
                                                            </button>
                                                        </div>
                                                    </template>
                                                </div>
                                            </template>
                                        </div>
                                        <button
                                            type="button"
                                            class="btn btn-secondary"
                                            x-show="block.index !== undefined"
                                            @click="poolForm.entries.splice(block.index, 1)"

                                        </button>
                                    </div>

                                <div class="list-row">
                                    <select class="form-input" aria-label="Entry kind" x-model="poolNewEntryKind">
                                        <template x-for="(kind, kindName) in poolKinds" :key="kindName">
                                            <option :value="kindName" x-text="kind.label"></option>
                                        </template>
                                    </select>
                                    <button type="button" class="btn btn-secondary" @click="addPoolEntry()">

                                    </button>
                                    <button
                                        type="button"
                                        class="btn btn-secondary"
                                        @click="togglePoolHexConfig()"

                                </div>
                            </div>
                        </form>

                    <section class="card" x-show="route.kind === 'files'">
