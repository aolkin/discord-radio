<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Bot Portal</title>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            background: white;
            border-radius: 12px;
            padding: 20px 30px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #667eea;
            font-size: 2rem;
            margin-bottom: 5px;
        }

        .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            color: #666;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #22c55e;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .status-dot.disconnected {
            background: #ef4444;
            animation: none;
        }

        .guilds-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 20px;
        }

        .guild-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .guild-card:hover {
            box-shadow: 0 8px 12px rgba(0, 0, 0, 0.15);
        }

        .guild-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .guild-id {
            font-size: 1.2rem;
            font-weight: 600;
            color: #333;
        }

        .voice-badge {
            background: #22c55e;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .section {
            margin-bottom: 20px;
        }

        .section:last-child {
            margin-bottom: 0;
        }

        .section-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: #666;
            text-transform: uppercase;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }

        .track-item, .info-item {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .track-name {
            font-weight: 600;
            color: #333;
            font-size: 0.95rem;
        }

        .track-details {
            font-size: 0.85rem;
            color: #666;
            margin-top: 4px;
        }

        .progress-bar {
            background: #e0e0e0;
            height: 6px;
            border-radius: 3px;
            margin-top: 6px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            background: linear-gradient(90deg, #22c55e, #16a34a);
            height: 100%;
            transition: width 0.5s linear;
        }

        .progress-time {
            font-size: 0.75rem;
            color: #999;
            margin-top: 2px;
        }

        .volume-bar {
            background: #e0e0e0;
            height: 4px;
            border-radius: 2px;
            margin-top: 6px;
            overflow: hidden;
        }

        .volume-fill {
            background: linear-gradient(90deg, #667eea, #764ba2);
            height: 100%;
            transition: width 0.3s;
        }

        .dj-state {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px;
            border-radius: 8px;
        }

        .dj-type {
            font-weight: 600;
            margin-bottom: 4px;
        }

        .dj-details {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        /* Modal styles */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            width: 100%;
            max-width: 700px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .modal-header {
            padding: 20px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 12px 12px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .close {
            color: white;
            font-size: 2rem;
            font-weight: bold;
            cursor: pointer;
            line-height: 1;
            opacity: 0.8;
            background: none;
            border: none;
        }

        .close:hover {
            opacity: 1;
        }

        .modal-body {
            padding: 30px;
            overflow-y: auto;
            flex: 1;
        }

        .modal-section {
            margin-bottom: 30px;
        }

        .modal-section:last-child {
            margin-bottom: 0;
        }

        .modal-section-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #667eea;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }

        .form-input {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 0.9rem;
            transition: border-color 0.2s;
        }

        .form-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(102, 126, 234, 0.3);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #e0e0e0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #d0d0d0;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .error-message, .success-message {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
        }

        .error-message {
            background: #fee;
            color: #ef4444;
            border: 1px solid #ef4444;
        }

        .success-message {
            background: #dcfce7;
            color: #22c55e;
            border: 1px solid #22c55e;
        }

        .empty-state {
            color: #999;
            font-style: italic;
            font-size: 0.9rem;
        }

        .no-guilds {
            background: white;
            border-radius: 12px;
            padding: 60px 20px;
            text-align: center;
            color: #999;
        }

        .no-guilds-icon {
            font-size: 4rem;
            margin-bottom: 15px;
        }

        @media (max-width: 768px) {
            .guilds-grid {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 1.5rem;
            }

            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body x-data="botPortal()" x-init="init()">
    <div class="container">
        <header>
            <h1>🎵 Discord Bot Portal</h1>
            <div class="status-indicator">
                <span class="status-dot" :class="{ 'disconnected': !connected }"></span>
                <span x-text="statusText"></span>
            </div>
        </header>

        <div class="guilds-grid" x-show="guilds.length > 0">
            <template x-for="guild in guilds" :key="guild.guild_id">
                <div class="guild-card">
                    <div class="guild-header">
                        <div class="guild-id" x-text="'Guild: ' + guild.guild_id"></div>
                        <span class="voice-badge" x-show="guild.in_voice">In Voice</span>
                    </div>

                    <!-- Hex Playback -->
                    <template x-if="guild.hex_playback && guild.hex_playback.message">
                        <div class="section">
                            <div class="section-title">Hex Playback</div>
                            <div class="info-item">
                                <div style="flex: 1;">
                                    <div class="track-name" x-text="guild.hex_playback.message"></div>
                                    <div class="track-details">
                                        Position: <span x-text="guild.hex_playback.current_position"></span> •
                                        Loop: <span x-text="guild.hex_playback.current_loop"></span><template x-if="guild.hex_playback.target_loops">/<span x-text="guild.hex_playback.target_loops"></span></template>
                                    </div>
                                    <div class="track-details">
                                        🔊 <div class="volume-bar" style="display: inline-block; width: 100px; vertical-align: middle;">
                                            <div class="volume-fill" :style="'width: ' + (guild.hex_playback.volume * 100) + '%'"></div>
                                        </div> <span x-text="Math.round(guild.hex_playback.volume * 100) + '%'"></span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </template>

                    <!-- DJ State -->
                    <template x-if="guild.dj_state">
                        <div class="section">
                            <div class="section-title">DJ State</div>
                            <div class="dj-state">
                                <div class="dj-type" x-text="guild.dj_state.state_type"></div>
                                <div class="dj-details" x-text="guild.dj_state.details"></div>
                            </div>
                        </div>
                    </template>

                    <!-- Audio Profile -->
                    <template x-if="guild.audio_profile">
                        <div class="section">
                            <div class="section-title">Audio Profile</div>
                            <div class="info-item">
                                <div style="flex: 1;">
                                    <div class="track-name" x-text="guild.audio_profile.name"></div>
                                    <div class="track-details" x-text="guild.audio_profile.forced ? '🔒 Locked by DJ' : '🔓 Normal'"></div>
                                </div>
                            </div>
                        </div>
                    </template>

                    <!-- Audio Tracks -->
                    <template x-if="guild.tracks && guild.tracks.length > 0">
                        <div class="section">
                            <div class="section-title">Audio Tracks</div>
                            <template x-for="track in guild.tracks" :key="track.filename">
                                <div class="track-item">
                                    <div style="flex: 1;">
                                        <div class="track-name" x-text="track.name"></div>
                                        <div class="track-details">
                                            <span x-text="track.filename.split('/').pop()"></span>
                                        </div>
                                        <template x-if="track.duration_secs && !track.loops">
                                            <div>
                                                <div class="progress-bar">
                                                    <div class="progress-fill" :style="'width: ' + getTrackProgress(track) + '%'"></div>
                                                </div>
                                                <div class="progress-time" x-text="getTrackTimeDisplay(track)"></div>
                                            </div>
                                        </template>
                                        <div class="track-details">
                                            <span x-text="track.loops ? '🔁 Looping' : '▶️ Once'"></span> •
                                            🔊 <div class="volume-bar" style="display: inline-block; width: 100px; vertical-align: middle;">
                                                <div class="volume-fill" :style="'width: ' + (track.volume * 100) + '%'"></div>
                                            </div> <span x-text="Math.round(track.volume * 100) + '%'"></span>
                                        </div>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </template>

                    <!-- Empty State -->
                    <template x-if="!guild.tracks.length && !guild.hex_playback?.message && !guild.dj_state && !guild.audio_profile">
                        <div class="empty-state">No active features</div>
                    </template>
                </div>
            </template>
        </div>

        <div class="no-guilds" x-show="guilds.length === 0">
            <div class="no-guilds-icon">💤</div>
            <p x-text="connected ? 'No active guilds' : 'Connecting to bot...'"></p>
        </div>
    </div>

    <script>
        function botPortal() {
            return {
                ws: null,
                connected: false,
                statusText: 'Connecting...',
                guilds: [],
                reconnectTimeout: null,
                currentTime: Date.now(),

                getTrackProgress(track) {
                    if (!track.duration_secs || track.loops) return 0;
                    const elapsedMs = this.currentTime - (track.start_time.secs_since_epoch * 1000 + track.start_time.nanos_since_epoch / 1000000);
                    const elapsedSecs = elapsedMs / 1000;
                    const progress = Math.min((elapsedSecs / track.duration_secs) * 100, 100);
                    return Math.max(0, progress);
                },

                getTrackTimeDisplay(track) {
                    if (!track.duration_secs) return '';
                    const elapsedMs = this.currentTime - (track.start_time.secs_since_epoch * 1000 + track.start_time.nanos_since_epoch / 1000000);
                    const elapsedSecs = Math.max(0, Math.min(elapsedMs / 1000, track.duration_secs));
                    return this.formatTime(elapsedSecs) + ' / ' + this.formatTime(track.duration_secs);
                },

                formatTime(seconds) {
                    const mins = Math.floor(seconds / 60);
                    const secs = Math.floor(seconds % 60);
                    return mins + ':' + secs.toString().padStart(2, '0');
                },

                init() {
                    this.connect();
                    // Update current time every 500ms for smooth progress bars
                    setInterval(() => {
                        this.currentTime = Date.now();
                    }, 500);
                },

                connect() {
                    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                    const wsUrl = `${protocol}//${window.location.host}/ws`;

                    this.ws = new WebSocket(wsUrl);

                    this.ws.onopen = () => {
                        this.connected = true;
                        this.statusText = 'Connected';
                        if (this.reconnectTimeout) {
                            clearTimeout(this.reconnectTimeout);
                            this.reconnectTimeout = null;
                        }
                    };

                    this.ws.onmessage = (event) => {
                        try {
                            const data = JSON.parse(event.data);
                            this.guilds = data.guilds || [];
                        } catch (e) {
                            console.error('Failed to parse message:', e);
                        }
                    };

                    this.ws.onerror = (error) => {
                        console.error('WebSocket error:', error);
                    };

                    this.ws.onclose = () => {
                        this.connected = false;
                        this.statusText = 'Disconnected - Reconnecting...';
                        this.reconnectTimeout = setTimeout(() => this.connect(), 3000);
                    };
                }
            };
        }
    </script>
</body>
</html>
