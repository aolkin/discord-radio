<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity Logs</title>
    <link rel="stylesheet" href="/static/base.css">
    <link rel="stylesheet" href="/static/logs.css">
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1 id="pageTitle">📜 Activity Logs</h1>
                <div class="log-info" id="logInfo">Loading...</div>
            </div>
            <button class="btn btn-secondary" onclick="window.close()">Close</button>
        </header>

        <div class="log-container">
            <div class="log-header">
                <div>
                    <strong>Total Entries:</strong> <span id="totalEntries">0</span>
                    <span class="badge badge-info" id="offsetInfo">Loading...</span>
                </div>
                <div>
                    <label>
                        <input type="number" class="limit-input" id="limitInput" min="10" max="500" value="50">
                        entries
                    </label>
                </div>
            </div>

            <div id="loadingState" class="loading">Loading logs...</div>
            <div id="errorState" class="error-message hidden"></div>
            <div id="emptyState" class="empty-state hidden">No log entries found</div>
            <div id="logsContent"></div>

            <div class="button-group hidden" id="navigationButtons">
                <button class="btn btn-primary" id="prevBtn" onclick="loadPreviousLogs()" disabled>← Previous</button>
                <button class="btn btn-primary" id="nextBtn" onclick="loadNextLogs()" disabled>Next →</button>
                <button class="btn btn-secondary" onclick="loadLatestLogs()">Latest</button>
            </div>
        </div>
    </div>

    <script>
        // Parse URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const guildId = urlParams.get('guild');
        const logType = urlParams.get('type');

        let currentResult = null;

        // Update page title
        document.getElementById('pageTitle').textContent = logType === 'members' 
            ? '👥 Member Activity Logs' 
            : '🎧 DJ Activity Logs';
        document.getElementById('logInfo').textContent = `Guild: ${guildId}`;

        async function loadLogs(offset = null, direction = 'backward') {
            const limit = Number.parseInt(document.getElementById('limitInput').value, 10) || 50;

            document.getElementById('loadingState').style.display = 'block';
            document.getElementById('errorState').style.display = 'none';
            document.getElementById('emptyState').style.display = 'none';
            document.getElementById('logsContent').innerHTML = '';
            document.getElementById('navigationButtons').style.display = 'none';

            try {
                let url = `/api/guilds/${guildId}/logs/${logType}?limit=${limit}&direction=${direction}`;
                if (offset !== null) {
                    url += `&offset=${offset}`;
                }

                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                currentResult = await response.json();

                document.getElementById('loadingState').style.display = 'none';

                if (!currentResult.entries || currentResult.entries.length === 0) {
                    document.getElementById('emptyState').style.display = 'block';
                    return;
                }

                renderLogs(currentResult.entries);

                // Update stats
                document.getElementById('totalEntries').textContent = currentResult.entries.length;
                document.getElementById('offsetInfo').textContent = 
                    `Offset: ${currentResult.start_offset} - ${currentResult.end_offset} / ${currentResult.file_size} bytes`;

                // Show navigation buttons
                document.getElementById('navigationButtons').style.display = 'flex';
                document.getElementById('prevBtn').disabled = !currentResult.has_previous;
                document.getElementById('nextBtn').disabled = !currentResult.has_next;

            } catch (error) {
                document.getElementById('loadingState').style.display = 'none';
                document.getElementById('errorState').style.display = 'block';
                document.getElementById('errorState').textContent = `Error loading logs: ${error.message}`;
            }
        }

        function renderLogs(entries) {
            const logsContent = document.getElementById('logsContent');

            entries.forEach(entry => {
                const logEntry = document.createElement('div');
                logEntry.className = `log-entry ${logType}`;

                if (logType === 'members') {
                    renderMemberEntry(logEntry, entry.content);
                } else if (logType === 'dj') {
                    renderDJEntry(logEntry, entry.content);
                }

                logsContent.appendChild(logEntry);
            });
        }

        function renderMemberEntry(element, content) {
            const time = document.createElement('div');
            time.className = 'log-time';
            time.textContent = new Date(content.timestamp).toLocaleString();

            const mainContent = document.createElement('div');
            mainContent.className = 'log-content';
            
            const actionEmoji = {
                'joined': '➕',
                'left': '➖',
                'moved': '↔️'
            };
            
            const emoji = actionEmoji[content.action] || '•';
            const nickname = content.nickname ? ` (${content.nickname})` : '';
            mainContent.textContent = `${emoji} ${content.username}${nickname} ${content.action}`;

            const detail = document.createElement('div');
            detail.className = 'log-detail';
            detail.textContent = `User ID: ${content.user_id}`;
            if (content.channel_id) {
                detail.textContent += ` | Channel ID: ${content.channel_id}`;
            }

            element.appendChild(time);
            element.appendChild(mainContent);
            element.appendChild(detail);
        }

        function renderDJEntry(element, content) {
            const time = document.createElement('div');
            time.className = 'log-time';
            time.textContent = new Date(content.timestamp).toLocaleString();

            const mainContent = document.createElement('div');
            mainContent.className = 'log-content';
            
            const eventEmoji = {
                'playing_track': '🎵',
                'playing_hex_message': '📡',
                'playing_noise': '🔊',
                'stopped': '⏹️'
            };
            
            const emoji = eventEmoji[content.event_type] || '•';
            mainContent.textContent = `${emoji} ${content.event_type.replace(/_/g, ' ').toUpperCase()}`;

            const detail = document.createElement('div');
            detail.className = 'log-detail';
            
            const details = content.details;
            if (details.filename) {
                detail.textContent = `Track: ${details.filename} (${details.duration_secs}s)`;
                if (details.forced_profile) {
                    detail.textContent += ` | Profile: ${details.forced_profile}`;
                }
            } else if (details.message) {
                detail.textContent = `Message: "${details.message}" (${details.target_loops} loops)`;
                if (details.forced_profile) {
                    detail.textContent += ` | Profile: ${details.forced_profile}`;
                }
            } else if (details.noise_profile) {
                detail.textContent = `Profile: ${details.noise_profile} (${details.duration_secs}s)`;
            } else if (details.duration_secs) {
                detail.textContent = `Duration: ${details.duration_secs}s`;
            }

            element.appendChild(time);
            element.appendChild(mainContent);
            element.appendChild(detail);
        }

        // biome-ignore lint/correctness/noUnusedVariables: called from the onclick attribute
        function loadPreviousLogs() {
            if (currentResult?.has_previous) {
                loadLogs(currentResult.start_offset, 'backward');
            }
        }

        // biome-ignore lint/correctness/noUnusedVariables: called from the onclick attribute
        function loadNextLogs() {
            if (currentResult?.has_next) {
                loadLogs(currentResult.end_offset, 'forward');
            }
        }

        function loadLatestLogs() {
            loadLogs(null, 'backward');
        }

        // Initial load
        loadLatestLogs();

        // Add event listener for limit change
        document.getElementById('limitInput').addEventListener('change', loadLatestLogs);
    </script>
</body>
</html>
